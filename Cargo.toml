[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = "0.37"
egui = "0.37"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.15"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-27", "download-binaries", "ndarray", "std", "tracing"] }
realfft = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
rodio = "0.23"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
toml = "1.2"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
