[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-27", "download-binaries", "ndarray", "std", "tls-rustls", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
